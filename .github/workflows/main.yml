name: Update DRM Playlist
on:
  schedule:
    - cron: "7 * * * *" 
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'hotstar.py' ]

jobs:
  update-playlist:
    runs-on: ubuntu-22.04  # Faster than ubuntu-latest
    concurrency:
      group: update-playlist
      cancel-in-progress: true
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            hotstar.py
            playlist.m3u
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Specific version
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install --no-cache-dir requests pytz
      
      - name: Run updater
        run: python hotstar.py
        timeout-minutes: 3
      
      - name: Push updates
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "sportlive18"
          git config user.email "271363488+sportlive18@users.noreply.github.com"
          
          if git diff --quiet playlist.m3u; then
            echo "No changes"
            exit 0
          fi
          
          git add playlist.m3u
          git commit -m "Update: $(date -u +'%Y%m%d-%H%M')"
          git push --force-with-lease origin main
